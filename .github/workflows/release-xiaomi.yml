name: Build (Xiaomi)

# One source branch, two package identities and update channels.
# Historical -xiaomi releases remain unchanged.

on:
  push:
    branches:
      - xiaomi
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-xiaomi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Test:
    if: github.ref == 'refs/heads/xiaomi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run test:release-channels

  Android:
    name: Android (${{ matrix.channel }})
    needs: [Test]
    strategy:
      fail-fast: false
      matrix:
        channel: [luna, kuwo]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Configure release channel
        run: node scripts/release-channel.cjs configure "${{ matrix.channel }}" >> "$GITHUB_ENV"

      - name: Build Packages
        env:
          DISABLE_SVG: 1
        shell: bash
        run: |
          cd android
          echo ${{ secrets.KEYSTORE_STORE_FILE_BASE64 }} | base64 --decode > app/${{ secrets.KEYSTORE_STORE_FILE }}
          ./gradlew assembleRelease -PlxReleaseChannel="${{ matrix.channel }}" -PMYAPP_UPLOAD_STORE_FILE='${{ secrets.KEYSTORE_STORE_FILE }}' -PMYAPP_UPLOAD_KEY_ALIAS='${{ secrets.KEYSTORE_KEY_ALIAS }}' -PMYAPP_UPLOAD_STORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' -PMYAPP_UPLOAD_KEY_PASSWORD='${{ secrets.KEYSTORE_KEY_PASSWORD }}'
          rm -f app/${{ secrets.KEYSTORE_STORE_FILE }}

      - name: Verify release package identity
        shell: bash
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          node scripts/release-channel.cjs verify "${{ matrix.channel }}" "$AAPT"

      - name: Rename channel APKs
        shell: bash
        run: |
          cd android/app/build/outputs/apk/release
          for f in lx-music-mobile-v${{ env.PACKAGE_VERSION }}-*.apk; do
            [ -e "$f" ] || continue
            base=${f%.apk}
            mv "$f" "${base}${{ env.RELEASE_SUFFIX }}.apk"
          done
          ls -la

      - name: Generate file MD5
        run: |
          cd android/app/build/outputs/apk/release
          md5sum *${{ env.RELEASE_SUFFIX }}.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-${{ matrix.channel }}-v${{ env.PACKAGE_VERSION }}
          path: android/app/build/outputs/apk/release/*${{ env.RELEASE_SUFFIX }}.apk
          if-no-files-found: error

  Release:
    name: Release (${{ matrix.channel }})
    runs-on: ubuntu-latest
    needs: [Android]
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: luna
            label: 汽水包名
          - channel: kuwo
            label: 酷我包名
    permissions:
      contents: write
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Configure release channel
        run: node scripts/release-channel.cjs configure "${{ matrix.channel }}" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: xiaomi-${{ matrix.channel }}-v${{ env.PACKAGE_VERSION }}
          path: ./artifacts

      - name: Build release notes
        shell: bash
        run: |
          PACKAGE_VERSION="${{ env.PACKAGE_VERSION }}"
          MD5_BLOCK=$(cd artifacts && md5sum *${{ env.RELEASE_SUFFIX }}.apk)
          # 用未加引号的 here-doc，让 ${PACKAGE_VERSION} / ${MD5_BLOCK} 被展开；
          # 反引号统一加 \ 转义为字面字符，避免被当成命令替换
          cat > release-notes.md <<EOF
          # LHX Music v${PACKAGE_VERSION} (小米后屏版 / ${{ matrix.label }})

          - 播放设置新增「显示 CarWith / Jovi InCar 歌词」，默认关闭，接入逐行和完整歌词
          - 补齐播放后延迟补发、关闭开关和切歌时的歌词清理，兼容性以设备实测为准
          - 安装包名：\`${{ env.APPLICATION_ID }}\`
          - 独立更新通道：\`${{ env.RELEASE_SUFFIX }}\`，安装后只检查和下载本包名的 release
          - 汽水包名与酷我包名两个版本会同时保留，可分别安装，数据相互独立
          - 保留已同步的上游改动和下载功能，后屏兼容性以设备实测为准
          - 首次从旧版升级，请手动下载相同包名的 v1.9.2 或更高版本覆盖安装；之后自动保持当前通道
          - 与对应官方应用包名冲突；同包名、同签名升级无需卸载，跨包名迁移需先备份再恢复
          - 历史 release 不删除，也不会把历史版本的包名替换成另一种

          ## File MD5
          \`\`\`
          ${MD5_BLOCK}
          \`\`\`
          EOF
          cat release-notes.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ./release-notes.md
          prerelease: false
          draft: false
          tag_name: v${{ env.PACKAGE_VERSION }}${{ env.RELEASE_SUFFIX }}
          target_commitish: ${{ github.sha }}
          name: LHX Music v${{ env.PACKAGE_VERSION }} (小米后屏版 / ${{ matrix.label }})
          fail_on_unmatched_files: true
          files: |
            artifacts/*${{ env.RELEASE_SUFFIX }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
